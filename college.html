<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>College Profile | Before You Join</title><style>:root{--ink:#171b25;--muted:#687282;--blue:#3158a8;--line:#e7ebf0;--bg:#f5f7fb;--orange:#8b5a00}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:900px;margin:auto;padding:18px}.top{display:flex;justify-content:space-between;align-items:center}.brand{font-size:20px;font-weight:900}.back,.link{color:var(--blue);font-weight:800;text-decoration:none}.hero{background:#101827;color:#fff;border-radius:23px;padding:23px;margin:18px 0}.eyebrow{font-size:11px;font-weight:800;letter-spacing:1px;color:#a9bfff}.hero h1{font-size:29px;line-height:35px;margin:8px 0}.hero p{color:#c8cfdb;line-height:21px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:12px}.badge{background:#edf3ff;color:var(--blue);padding:6px 9px;border-radius:9px;font-size:11px;font-weight:800}.green{background:#eaf8f1;color:#147a4b}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:15px}.card,.section{background:#fff;border:1px solid var(--line);border-radius:18px;padding:18px}.card h2,.section h2{margin:0 0 12px}.info{display:grid;grid-template-columns:1fr 1fr;gap:10px}.label{font-size:10px;text-transform:uppercase;letter-spacing:.5px;color:#89919d}.value{font-size:14px;font-weight:700;margin-top:3px}.section{margin:14px 0}.item{border:1px solid #edf0f4;border-radius:14px;padding:14px;margin:9px 0}.item h3{margin:0 0 6px;font-size:15px}.meta{font-size:12px;color:var(--muted);line-height:18px}.text{font-size:13px;line-height:20px;color:#596373}.pill{display:inline-block;font-size:10px;font-weight:800;padding:5px 8px;border-radius:8px;background:#fff5df;color:var(--orange);margin:0 5px 8px 0}.empty{padding:14px;background:#fafbfc;border-radius:12px;color:var(--muted);font-size:13px}.note{font-size:12px;line-height:18px;color:#687282;background:#eef5ff;border-radius:13px;padding:13px;margin:10px 0}.source{font-size:11px;color:#8a929e;line-height:17px}.loading{text-align:center;padding:60px;color:var(--muted)}@media(max-width:620px){.grid{grid-template-columns:1fr}.info{grid-template-columns:1fr 1fr}}</style></head><body><div class="wrap"><div class="top"><div class="brand">Before You Join</div><a class="back" href="./government-medical-colleges.html">‹ Colleges</a></div><div id="app" class="loading">Loading college profile…</div></div><script>const p=new URLSearchParams(location.search);const wanted={name:p.get('name')||'',state:p.get('state')||'',city:p.get('city')||'',university:p.get('university')||'',seats:p.get('seats')||'',management:p.get('management')||'',estd:p.get('estd')||''};const app=document.getElementById('app');const NEWS_URLS=['./data/news.json','./data/news-additional.json'];function norm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\b(the|and|of|medical|college|hospital|government|govt|autonomous|state|institute|sciences)\b/g,' ').replace(/\s+/g,' ').trim()}function esc(s){return String(s??'').replace(/[&<>\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}function score(a,b){a=norm(a);b=norm(b);if(!a||!b)return 0;if(a===b)return 100;if(a.includes(b)||b.includes(a))return 80;let A=new Set(a.split(' ')),B=new Set(b.split(' '));return [...A].filter(x=>B.has(x)).length/Math.max(A.size,B.size)*70}function fmtDate(x){return x?new Date(x).toLocaleDateString('en-IN',{day:'numeric',month:'short',year:'numeric'}):''}function cardNews(n){return `<article class="item"><span class="pill">📰 Newspaper report</span><h3>${esc(n.title)}</h3><div class="meta">${esc(n.publisher)} · ${esc(fmtDate(n.date))}</div><p class="text">${esc(n.summary)}</p>${n.status?`<div class="meta"><b>Reported status:</b> ${esc(n.status)}</div>`:''}<p><a class="link" href="${esc(n.url)}" target="_blank" rel="noopener">Read original newspaper report →</a></p></article>`}async function init(){try{const responses=await Promise.all(NEWS_URLS.map(u=>fetch(u).then(r=>r.ok?r.json():{items:[]})));let items=responses.flatMap(d=>d.items||[]);let seen=new Set();items=items.filter(n=>{if(seen.has(n.id))return false;seen.add(n.id);return true});let news=items.filter(n=>Math.max(score(n.collegeKey,wanted.name),...(n.aliases||[]).map(a=>score(a,wanted.name)))>=55);news.sort((a,b)=>String(b.date).localeCompare(String(a.date)));render(news)}catch(e){render([])}}function render(news){app.className='';app.innerHTML=`<section class="hero"><div class="eyebrow">COLLEGE PROFILE</div><h1>${esc(wanted.name||'Medical College')}</h1><p>${esc(wanted.city)}${wanted.state?' · '+esc(wanted.state):''}</p><div class="badges"><span class="badge green">${esc(wanted.management||'Government')}</span>${wanted.seats?`<span class="badge">${esc(wanted.seats)} MBBS seats</span>`:''}${wanted.estd?`<span class="badge">Established ${esc(wanted.estd)}</span>`:''}</div></section><div class="grid"><div class="card"><h2>College information</h2><div class="info"><div><div class="label">State</div><div class="value">${esc(wanted.state)||'Not listed'}</div></div><div><div class="label">City</div><div class="value">${esc(wanted.city)||'Not listed'}</div></div><div><div class="label">University</div><div class="value">${esc(wanted.university)||'Not listed'}</div></div><div><div class="label">MBBS seats</div><div class="value">${esc(wanted.seats)||'Not listed'}</div></div></div></div><div class="card"><h2>Ragging history</h2><div class="value" style="font-size:28px">${news.length}</div><div class="meta">newspaper reports currently linked to this college</div></div></div><div class="note"><b>How we present this:</b> Ragging history on this profile is based on <b>newspaper reports</b>, not the anti-ragging portal. A newspaper report may describe an allegation, investigation, disciplinary action, police case or court proceeding. It is not automatically proof that every allegation was established.</div><section class="section"><h2>📰 Ragging History · Newspaper Reports</h2>${news.length?news.map(cardNews).join(''):'<div class="empty">No newspaper report is currently linked to this college in our archive. That does <b>not</b> mean no ragging incident has ever been reported.</div>'}</section><section class="section"><h2>Sources & verification</h2><p class="source">Newspaper reports are independent media sources. For regulatory or complaint-record verification, users can separately consult the National Anti-Ragging Helpline registry and NMC. Those sources are not used as the primary Ragging History feed on this profile.</p><p><a class="link" href="https://www.antiragging.in/complaints-record/new-complaints-record.php" target="_blank" rel="noopener">Open official anti-ragging registry →</a></p><p><a class="link" href="https://www.nmc.org.in/information-desk/for-students-to-study-in-india/list-of-college-teaching-mbbs/" target="_blank" rel="noopener">Open NMC MBBS college list →</a></p></section>`}init();</script></body></html>
