<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Before You Join</title><style>
:root{--bg:#f6f7fb;--ink:#171b25;--muted:#687282;--blue:#3158a8;--red:#b42318;--line:#e8ebf0;--green:#147a4b;--orange:#9a5b00}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.app{max-width:650px;margin:auto;min-height:100vh;background:var(--bg)}header{height:64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 20px;position:sticky;top:0;z-index:5}.logo{font-weight:900;font-size:20px}.beta{font-size:11px;font-weight:800;color:var(--blue);background:#eaf0ff;padding:5px 9px;border-radius:20px}main{padding:20px;padding-bottom:50px}.hero{background:#101827;border-radius:24px;padding:24px;margin-bottom:22px}.eyebrow{color:#9fb9ff;font-weight:800;font-size:12px;letter-spacing:1.2px}.hero h1{color:#fff;font-size:30px;line-height:36px;margin:12px 0}.hero p{color:#c8cfdb;line-height:22px}.search{background:#fff;border-radius:15px;height:54px;display:flex;align-items:center;padding:0 16px;margin-top:20px;cursor:pointer}.search span{color:#7a8494}.section{font-size:20px;font-weight:800;margin:18px 0 13px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.tile,.card,.help,.review,.stats,.warning,.news{background:#fff;border:1px solid #edf0f4;border-radius:18px}.tile{min-height:128px;cursor:pointer;padding:17px}.icon{font-size:25px}.tile h3{font-size:15px;margin:12px 0 5px}.sub,.city{color:#788190;font-size:13px}.help{margin-top:20px;padding:18px}.help h3{margin:0}.number{font-size:22px;font-weight:900;color:var(--blue);margin-top:5px}.back{color:var(--blue);font-weight:800;cursor:pointer;margin-bottom:16px}.title{font-size:28px;line-height:34px;font-weight:900;margin:0 0 6px}.input{width:100%;border:1px solid #dfe3e9;border-radius:14px;background:#fff;padding:15px;font:inherit;color:var(--ink);margin:10px 0 18px}.result{display:flex;justify-content:space-between;gap:10px;cursor:pointer;margin-bottom:11px;padding:17px}.result h3{margin:0;font-size:16px}.badges{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.badge{font-size:11px;font-weight:800;padding:5px 8px;border-radius:10px;background:#f0f2f5;color:#5e6674}.red{background:#fff0f0;color:var(--red)}.blue{background:#edf3ff;color:var(--blue)}.green{background:#eaf8f1;color:var(--green)}.orange{background:#fff5df;color:var(--orange)}.stats{display:grid;grid-template-columns:repeat(3,1fr);margin:18px 0 14px;padding:16px 0}.stat{text-align:center;border-right:1px solid #eef0f3}.stat:last-child{border:0}.stat strong{font-size:21px}.stat small{display:block;color:#7c8490;font-size:10px;margin-top:4px}.warning{background:#fff7f2;border-color:#f8ded0;padding:17px}.warning b{color:#8f2d1d}.warning p{color:#765d55;font-size:13px;line-height:19px}.review{padding:17px;margin-bottom:12px}.review h3{font-size:16px;margin:12px 0 7px}.review p{color:#616b7a;font-size:13px;line-height:20px}.news{padding:16px;margin-top:14px}.news h3{margin:0 0 5px;font-size:16px}.news-item{border-top:1px solid #eef0f3;padding:14px 0}.news-item:first-of-type{border-top:0}.news-title{font-weight:800;font-size:14px;line-height:19px}.news-meta{font-size:11px;color:#8a929e;margin:5px 0 7px}.news-summary{font-size:12px;color:#606a78;line-height:18px;margin:0 0 8px}.primary{width:100%;border:0;background:var(--blue);color:white;border-radius:15px;padding:15px;font-weight:800;font-size:15px;cursor:pointer}.notice{padding:14px 16px;border-radius:15px;background:#eef5ff;color:#435a80;font-size:12px;line-height:18px;margin:12px 0 18px}.small{font-size:11px;color:#8a929e;line-height:17px}.link{color:var(--blue);font-weight:800;text-decoration:none}.center{text-align:center;padding-top:80px}
</style></head><body><div class="app"><header><div class="logo">Before You Join</div><div class="beta">BETA</div></header><main id="app"></main></div><script>
let DB={records:[],news:[],registryTotal:5069,sourceUrl:'https://www.antiragging.in/complaints-record/new-complaints-record.php'};const app=document.getElementById('app');
fetch('data/ragging-records.json').then(r=>r.json()).then(d=>{DB=d;home()}).catch(()=>home());
function esc(s){return String(s||'').replace(/[&<>\\\"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','\\':'&#92;','"':'&quot;'}[m]))}
function medical(r){return /medical|hospital|mbbs|medical college|institute of medical|medical sciences/i.test(r.college)}
function newsFor(college){let key=(college||'').toLowerCase();return (DB.news||[]).filter(n=>key.includes((n.collegeKey||'').toLowerCase())||(n.aliases||[]).some(a=>key.includes(a.toLowerCase())||a.toLowerCase().includes(key)))}
function newsSection(college){let ns=newsFor(college);if(!ns.length)return `<div class="news"><h3>📰 News cuttings</h3><p class="small">No linked news report has been added to this college yet. This does not mean no incident was reported; the news archive is being built separately from the official complaint registry.</p></div>`;return `<div class="news"><h3>📰 News cuttings</h3><p class="small">Independent news reports are shown separately from official complaint records. A news report is not, by itself, proof that every allegation in the report was established.</p>${ns.map(n=>`<div class="news-item"><div class="news-title">${esc(n.title)}</div><div class="news-meta">${esc(n.publisher)} • ${esc(n.date)}</div><p class="news-summary">${esc(n.summary)}</p><a class="link" href="${esc(n.url)}" target="_blank" rel="noopener">Read original report →</a></div>`).join('')}</div>`}
function home(){const med=DB.records.filter(medical);const serious=DB.records.filter(r=>r.complaintType==='Serious').length;app.innerHTML=`<section class="hero"><div class="eyebrow">BEFORE YOU JOIN</div><h1>Know the college before you choose the college.</h1><p>Explore official anti-ragging complaint records and student-safety information before making a decision.</p><div class="search" onclick="search()"><b style="font-size:24px;margin-right:8px">⌕</b><span>Search a medical college</span></div></section><div class="notice"><b>Official-record-first.</b> The national anti-ragging registry currently reports <b>${DB.registryTotal.toLocaleString()}</b> complaints. This GitHub site includes a locally stored verified sample while the official registry remains the complete source of record. <a class="link" href="${DB.sourceUrl}" target="_blank" rel="noopener">Open official registry →</a></div><div class="section">Explore</div><div class="grid"><div class="tile" onclick="search()"><div class="icon">🏥</div><h3>Medical Colleges</h3><div class="sub">${med.length} records in this build</div></div><div class="tile" onclick="showRecords()"><div class="icon">📋</div><h3>Official Records</h3><div class="sub">Browse stored complaint records</div></div><div class="tile" onclick="serious()"><div class="icon">🔴</div><h3>Serious Records</h3><div class="sub">${serious} in this build</div></div><div class="tile" onclick="about()"><div class="icon">ℹ️</div><h3>How to read this</h3><div class="sub">Source & safety notes</div></div></div><div class="help"><h3>Need help with ragging?</h3><div class="sub" style="margin-top:7px">National Anti-Ragging Helpline</div><div class="number">1800-180-5522</div><div class="small">For urgent complaints, use the official anti-ragging channels.</div></div>`}
function search(){app.innerHTML=`<div class="back" onclick="home()">‹ Back</div><h1 class="title">Find your college</h1><input class="input" autofocus placeholder="College name, city or state..." oninput="filter(this.value)"><div id="results"></div>`;filter('')}
function filter(q){let r=DB.records.filter(medical).filter(c=>(c.college+' '+c.state+' '+c.university).toLowerCase().includes(q.toLowerCase()));document.getElementById('results').innerHTML=r.length?r.map(c=>card(c)).join(''):`<div class="card" style="padding:18px"><b>No stored medical-college match.</b><p class="small">The official registry is larger than this current local build. Use the official registry for the complete record set.</p><a class="link" href="${DB.sourceUrl}" target="_blank">Open official registry →</a></div>`}
function card(c){return `<div class="card result" onclick='record(${JSON.stringify(c).replace(/'/g,"&#39;")})'><div><h3>${esc(c.college)}</h3><div class="city">${esc(c.state)} • ${esc(c.university)}</div><div class="badges"><span class="badge ${c.complaintType==='Serious'?'red':'blue'}">${esc(c.complaintType)}</span><span class="badge">${esc(c.status)}</span></div></div><b style="font-size:28px;color:#9aa2af">›</b></div>`}
function record(r){app.innerHTML=`<div class="back" onclick="search()">‹ Back</div><h1 class="title">${esc(r.college)}</h1><div class="city">${esc(r.state)} • ${esc(r.university)}</div><div class="stats"><div class="stat"><strong>${esc(r.complaintType)}</strong><small>Complaint type</small></div><div class="stat"><strong>${esc(r.status)}</strong><small>Status</small></div><div class="stat"><strong>${r.suicide?'Yes':'No'}</strong><small>Suicide flag</small></div></div><div class="warning"><b>Important context</b><p>This entry means a complaint is recorded in the official anti-ragging registry. It does <b>not</b> by itself establish that the allegation was proven or that the college has a persistent ragging problem.</p></div><div class="review"><span class="badge blue">Official registry record</span><h3>Complaint ${esc(r.complaintNo)}</h3><p><b>Registered:</b> ${esc(r.registeredAt)}<br><b>Victim gender:</b> ${esc(r.victimGender)}<br><b>Regulatory code:</b> ${esc(r.regCode)||'Not listed'}${r.suicide?'<br><b>Registry note:</b> '+esc(r.suicide):''}</p></div>${newsSection(r.college)}<a class="link" href="${DB.sourceUrl}" target="_blank" rel="noopener">Verify against the official registry →</a>`}
function showRecords(){app.innerHTML=`<div class="back" onclick="home()">‹ Back</div><h1 class="title">Stored official records</h1><p class="city">${DB.records.length} records are bundled with this version. They are sourced from the official national anti-ragging registry search result.</p><div id="all">${DB.records.map(card).join('')}</div>`}
function serious(){app.innerHTML=`<div class="back" onclick="home()">‹ Back</div><h1 class="title">Serious records</h1><p class="city">Serious records in the locally stored dataset.</p>${DB.records.filter(r=>r.complaintType==='Serious').map(card).join('')}`}
function about(){app.innerHTML=`<div class="back" onclick="home()">‹ Back</div><h1 class="title">About the data</h1><div class="review"><h3>What is official?</h3><p>The complaint records come from the National Anti-Ragging Helpline's public complaint-record page. The site currently reports ${DB.registryTotal.toLocaleString()} complaints.</p><p>Each record should be interpreted as a <b>registered complaint</b>, not as an automatic finding of guilt.</p></div><div class="review"><h3>What are news cuttings?</h3><p>News cuttings are independent media reports linked to a college. They are kept separate from official complaint records and are labelled with the publisher and date.</p></div><div class="review"><h3>Medical-college rules</h3><p>NMC regulations prohibit ragging in medical colleges and require institutions to take preventive and disciplinary measures.</p><a class="link" href="https://www.nmc.org.in/anti-ragging/" target="_blank">NMC Anti-Ragging →</a></div><div class="review"><h3>Complete source</h3><a class="link" href="${DB.sourceUrl}" target="_blank">National Anti-Ragging complaint records →</a></div>`}
</script></body></html>
